<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>浏览器小工具BWidgets</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- 语言切换按钮 -->
    <div class="lang-toggle">
      <button id="langToggleBtn" class="lang-btn active" data-lang="en">EN</button>
      <button id="langToggleZn" class="lang-btn" data-lang="zh">ZH</button>
    </div>

    <h1 class="title" data-i18n="title">🎬 浏览器小工具BWidgets</h1>

    <div class="info-box">
      <div id="tab-info">加载中...</div>
    </div>

    <!-- 语言设置 -->
    <div class="section language-settings">
      <div class="lang-row">
        <label data-i18n="sourceLang">原文语言:</label>
        <select id="sourceLangSelect" class="lang-select">
          <option value="auto">自动检测</option>
          <option value="en">English</option>
          <option value="zh">中文</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="ru">Русский</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
      </div>
      <div class="lang-row">
        <label data-i18n="targetLang">翻译目标:</label>
        <select id="targetLangSelect" class="lang-select">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="ru">Русский</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
      </div>
    </div>

    <!-- 翻译控制区 -->
    <div class="section" id="translate-section">
      <button id="translateBtn" class="btn btn-primary">
        🎙️ <span data-i18n="startTranslate">开始翻译</span>
      </button>
      <p class="hint" data-i18n="hint">点击按钮捕获当前标签页音频进行语音识别翻译</p>
    </div>

    <!-- 翻译结果区（默认隐藏） -->
    <div class="section" id="result-section" style="display:none">
      <div class="status-box">
        <div id="status">🎧 正在识别中...</div>
      </div>
      
      <!-- 翻译历史列表 -->
      <div class="history-container">
        <div id="history-list">
          <div class="history-empty" data-i18n="noHistory">暂无翻译记录</div>
        </div>
      </div>
      
      <div class="btn-row">
        <button id="clearBtn" class="btn btn-secondary">🗑️ <span data-i18n="clear">清屏</span></button>
        <button id="stopBtn" class="btn btn-secondary" data-i18n="stop">停止</button>
        <button id="restartBtn" class="btn btn-primary" data-i18n="restart">重新翻译</button>
      </div>
    </div>

    <div class="section">
      <button id="settingsBtn" class="btn btn-secondary">
        ⚙️ <span data-i18n="settings">设置</span>
      </button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
