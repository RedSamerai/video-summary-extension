<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>浏览器小工具BWidgets</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Tab 切换 -->
  <div class="tab-bar">
    <button id="tabTranslate" class="tab-btn active" data-tab="translate">🎬 视频翻译</button>
    <button id="tabSummary" class="tab-btn" data-tab="summary">📝 网页摘要</button>
  </div>

  <!-- 翻译内容 -->
  <div id="translate-content">
    <div class="container">
      <!-- 语言切换按钮 -->
      <div class="lang-toggle">
        <button id="langToggleBtnTranslate" class="lang-btn active" data-lang="en">EN</button>
        <button id="langToggleZnTranslate" class="lang-btn" data-lang="zh">ZH</button>
      </div>

      <h1 class="title" data-i18n="title">🎬 视频翻译与摘要</h1>

      <div class="info-box">
        <div id="tab-info">加载中...</div>
      </div>

      <!-- 语言设置 -->
      <div class="section language-settings">
        <div class="lang-row">
          <label data-i18n="sourceLang">原文语言:</label>
          <select id="sourceLangSelect" class="lang-select">
            <option value="auto">自动检测</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="ru">Русский</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
        </div>
        <div class="lang-row">
          <label data-i18n="targetLang">翻译目标:</label>
          <select id="targetLangSelect" class="lang-select">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="ru">Русский</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
        </div>
      </div>

      <!-- 翻译控制区 -->
      <div class="section" id="translate-section">
        <button id="translateBtn" class="btn btn-primary">
          🎙️ <span data-i18n="startTranslate">开始翻译</span>
        </button>
        <p class="hint" data-i18n="hint">点击按钮捕获当前标签页音频进行语音识别翻译</p>
      </div>

      <!-- 翻译结果区（默认隐藏） -->
      <div class="section" id="result-section" style="display:none">
        <div class="status-box">
          <div id="status">🎧 正在识别中...</div>
        </div>
        
        <!-- 翻译历史列表 -->
        <div class="history-container">
          <div id="history-list">
            <div class="history-empty" data-i18n="noHistory">暂无翻译记录</div>
          </div>
        </div>
        
        <div class="btn-row">
          <button id="clearBtn" class="btn btn-secondary">🗑️ <span data-i18n="clear">清屏</span></button>
          <button id="stopBtn" class="btn btn-secondary" data-i18n="stop">停止</button>
          <button id="restartBtn" class="btn btn-primary" data-i18n="restart">重新翻译</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 摘要内容（默认隐藏） -->
  <div id="summary-content" style="display:none">
    <div class="container">
      <!-- 语言切换按钮 -->
      <div class="lang-toggle">
        <button id="langToggleBtnSummary" class="lang-btn" data-lang="en">EN</button>
        <button id="langToggleZnSummary" class="lang-btn active" data-lang="zh">ZH</button>
      </div>

      <h1 class="title" data-i18n="summaryTitle">📝 网页摘要</h1>

      <div class="info-box">
        <div id="tab-info-summary">加载中...</div>
      </div>

      <div class="section">
        <button id="summarizeBtn" class="btn btn-primary">
          📄 <span data-i18n="getSummary">获取当前页摘要</span>
        </button>
        <p class="hint" data-i18n="summaryHint">使用浏览器内置 AI 生成摘要（无需代理）</p>
      </div>

      <!-- 摘要结果区 -->
      <div class="section" id="summary-result-section" style="display:none">
        <div class="status-box">
          <div id="summary-status">准备就绪</div>
        </div>

        <div class="summary-container" id="summary-container">
          <div id="summary-loading" style="display:none;text-align:center;padding:20px;color:#94a3b8;">
            正在生成摘要...
          </div>
          <div id="summary-result"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="readability.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
